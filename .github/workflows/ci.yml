name: CI Workflow

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js

      - name: Test HTML content
        run: grep -q "<html" index.html

      - name: Test CSS content
        run: grep -q "body" style.css

      - name: Test JavaScript content
        run: grep -q "function changeMessage" script.js
